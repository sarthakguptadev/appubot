name: TestFlight group
# Gives an iOS build that's already on App Store Connect to TestFlight groups (the iOS workflow does this after each
# upload). Groups: names split by commas; empty uses the TESTFLIGHT_GROUPS variable, else the app's only group.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (expo.version, like 2026.11.01)
        required: true
        type: string
      build:
        description: Build number (expo.ios.buildNumber)
        required: true
        type: string
      groups:
        description: TestFlight groups, split by commas (optional)
        required: false
        type: string
      whats_new:
        description: What to Test, for external testers (optional)
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  testflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow testflight.yml --status completed --limit 100 --json databaseId --jq '.[].databaseId' |
            while read -r id; do
              if [ "$id" != "$GITHUB_RUN_ID" ]; then gh run delete "$id" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || true; fi
            done
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
          show-progress: false
      - env:
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APP_ID: '6829390070'
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          GROUPS: ${{ inputs.groups || vars.TESTFLIGHT_GROUPS }}
          WHATS_NEW: ${{ inputs.whats_new }}
        run: node .github/scripts/testflight.mjs
